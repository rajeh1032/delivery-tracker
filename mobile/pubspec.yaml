name: delivery_tracker
description: "A new Flutter project."

publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.12.2


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management & Value Equality
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Networking & REST API
  dio: ^5.9.0
  retrofit: ^4.4.0
  pretty_dio_logger: ^1.4.0
  json_annotation: ^4.12.0

  # Local Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Connectivity & Hardware
  connectivity_plus: ^6.1.5
  internet_connection_checker_plus: ^2.5.2
  image_picker: ^1.1.2

  # Dependency Injection & Utils
  get_it: ^8.0.3
  injectable: ^2.5.0
  uuid: ^4.5.1
  intl: ^0.20.2
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.2
  flutter_native_splash: ^2.4.8
  google_maps_flutter: ^2.18.1
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  injectable_generator: ^2.6.1
  retrofit_generator: ^10.2.0
  json_serializable: ^6.9.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  path_provider_platform_interface: ^2.1.2
  flutter_launcher_icons: ^0.14.4
flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/images/
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon_ios.png"
  image_path_android: "assets/images/app_icon.png"
  image_path_ios: "assets/images/app_icon_ios.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/app_icon.png"

